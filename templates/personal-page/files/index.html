<!DOCTYPE html>
<html lang="en">
<head>

  <title>Your Name</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 18px/1.65 Georgia, 'Times New Roman', serif; background: Canvas; color: CanvasText; }
    main { max-width: 34em; margin: 0 auto; padding: 72px 24px; }
    h1 { font-size: 40px; line-height: 1.1; margin: 0 0 8px; }

    a { color: inherit; }
    ul { padding-left: 1.2em; }
  </style>
</head>
<body>
  <main>
    <h1>Your Name</h1>
    <p class="role">What you do, in one line</p>
    <p>A few sentences about yourself: what you work on, what you like to build, and how people can reach you.</p>
    <h2>Elsewhere</h2>
    <ul>
      <li><a href="mailto:you@example.com">you@example.com</a></li>
      <li><a href="https://github.com/">GitHub</a></li>
    </ul>
  </main>

</html>
