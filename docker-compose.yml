# Pi-PaaS, Docker Edition
#   docker compose up -d        then open http://<host>:9000
# The first password is printed in "docker compose logs" and saved in
# /srv/pi-paas-data/initial-password.txt.
services:
  pi-paas:
    build: .
    container_name: pi-paas
    restart: unless-stopped
    # Host networking: app ports, the built-in proxy (80/443) and .local names
    # work exactly as in the Standalone Edition.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside: Docker mounts app volumes by host path.
      - /srv/pi-paas-data:/srv/pi-paas-data
    environment:
      PIPAAS_RUNTIME: docker
      PIPAAS_DATA_DIR: /srv/pi-paas-data
      # PIPAAS_PASSWORD: choose-a-first-password
      # PIPAAS_PROXY_PORT: "off"     # if something else already uses port 80
