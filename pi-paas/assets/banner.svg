<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
  </defs>

  <rect fill="url(#bgGrad)" width="1280" height="640"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#4a9eff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="640"/><line x1="40" y1="0" x2="40" y2="640"/>
    <line x1="80" y1="0" x2="80" y2="640"/><line x1="120" y1="0" x2="120" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="640"/><line x1="200" y1="0" x2="200" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="640"/><line x1="280" y1="0" x2="280" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/><line x1="360" y1="0" x2="360" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/><line x1="440" y1="0" x2="440" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/><line x1="520" y1="0" x2="520" y2="640"/>
    <line x1="560" y1="0" x2="560" y2="640"/><line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="440" x2="1280" y2="440"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="520" x2="1280" y2="520"/><line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Mini π pixel art logo on the left -->
  <g transform="translate(200, 160) scale(0.6)">
    <rect fill="#4a9eff" x="64" y="64" width="192" height="24"/>
    <rect fill="#7bb8ff" x="64" y="64" width="192" height="6"/>
    <rect fill="#4a9eff" x="48" y="64" width="24" height="12"/>
    <rect fill="#4a9eff" x="240" y="64" width="24" height="12"/>
    <rect fill="#4a9eff" x="104" y="88" width="24" height="120"/>
    <rect fill="#7bb8ff" x="104" y="88" width="6" height="120"/>
    <rect fill="#4a9eff" x="192" y="88" width="24" height="96"/>
    <rect fill="#7bb8ff" x="192" y="88" width="6" height="96"/>
    <rect fill="#4a9eff" x="176" y="184" width="24" height="24"/>
    <rect fill="#4a9eff" x="160" y="196" width="24" height="24"/>

    <!-- Server -->
    <rect fill="#16213e" x="32" y="240" width="256" height="48" rx="6"/>
    <rect fill="#1d9e75" x="40" y="248" width="240" height="32" rx="3"/>
    <rect fill="#34d399" x="52" y="254" width="60" height="8" rx="1"/>
    <rect fill="#34d399" x="52" y="266" width="60" height="8" rx="1"/>
    <rect fill="#34d399" x="128" y="254" width="60" height="8" rx="1"/>
    <rect fill="#34d399" x="128" y="266" width="60" height="8" rx="1"/>
    <rect fill="#34d399" x="204" y="254" width="60" height="8" rx="1"/>
    <rect fill="#34d399" x="204" y="266" width="60" height="8" rx="1"/>
    <circle fill="#f87171" cx="62" cy="258" r="2"/>
    <circle fill="#34d399" cx="70" cy="258" r="2"/>
    <circle fill="#34d399" cx="138" cy="258" r="2"/>
    <circle fill="#fb923c" cx="146" cy="258" r="2"/>
    <circle fill="#34d399" cx="214" cy="258" r="2"/>
    <circle fill="#34d399" cx="222" cy="258" r="2"/>

    <!-- Upload arrow -->
    <rect fill="#a78bfa" x="148" y="24" width="12" height="32"/>
    <polygon fill="#a78bfa" points="142,24 166,24 154,4"/>
  </g>

  <!-- Title text -->
  <text x="640" y="260" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="72" fill="#4a9eff" letter-spacing="4">Pi-PaaS</text>
  <text x="640" y="320" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#6b7280">Mini Platform-as-a-Service for your Pi</text>

  <!-- Feature pills -->
  <g font-family="monospace" font-size="16">
    <rect x="340" y="370" width="120" height="32" rx="16" fill="rgba(74,158,255,0.15)" stroke="#4a9eff" stroke-width="1"/>
    <text x="400" y="391" text-anchor="middle" fill="#4a9eff">ZIP Upload</text>

    <rect x="480" y="370" width="100" height="32" rx="16" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1"/>
    <text x="530" y="391" text-anchor="middle" fill="#34d399">Node.js</text>

    <rect x="600" y="370" width="100" height="32" rx="16" fill="rgba(251,146,60,0.15)" stroke="#fb923c" stroke-width="1"/>
    <text x="650" y="391" text-anchor="middle" fill="#fb923c">Python</text>

    <rect x="720" y="370" width="100" height="32" rx="16" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="1"/>
    <text x="770" y="391" text-anchor="middle" fill="#a78bfa">SQLite</text>

    <rect x="840" y="370" width="120" height="32" rx="16" fill="rgba(248,113,113,0.15)" stroke="#f87171" stroke-width="1"/>
    <text x="900" y="391" text-anchor="middle" fill="#f87171">PostgreSQL</text>
  </g>

  <!-- Feature badges row 2 -->
  <g font-family="monospace" font-size="16">
    <rect x="380" y="420" width="130" height="32" rx="16" fill="rgba(74,158,255,0.1)" stroke="#4a9eff" stroke-width="0.5"/>
    <text x="445" y="441" text-anchor="middle" fill="#4a9eff" opacity="0.7">Code Editor</text>

    <rect x="530" y="420" width="130" height="32" rx="16" fill="rgba(52,211,153,0.1)" stroke="#34d399" stroke-width="0.5"/>
    <text x="595" y="441" text-anchor="middle" fill="#34d399" opacity="0.7">File Manager</text>

    <rect x="680" y="420" width="130" height="32" rx="16" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="0.5"/>
    <text x="745" y="441" text-anchor="middle" fill="#a78bfa" opacity="0.7">6 Languages</text>

    <rect x="830" y="420" width="130" height="32" rx="16" fill="rgba(251,146,60,0.1)" stroke="#fb923c" stroke-width="0.5"/>
    <text x="895" y="441" text-anchor="middle" fill="#fb923c" opacity="0.7">Multi-Distro</text>
  </g>

  <!-- Bottom tagline -->
  <text x="640" y="540" text-anchor="middle" font-family="monospace" font-size="18" fill="#44445a">Deploy web apps from your browser · No Docker required</text>

  <!-- Pixel decorations -->
  <rect fill="#4a9eff" x="40" y="40" width="8" height="8" opacity="0.4"/>
  <rect fill="#4a9eff" x="56" y="40" width="8" height="8" opacity="0.2"/>
  <rect fill="#4a9eff" x="40" y="56" width="8" height="8" opacity="0.2"/>
  <rect fill="#34d399" x="1232" y="40" width="8" height="8" opacity="0.4"/>
  <rect fill="#34d399" x="1216" y="40" width="8" height="8" opacity="0.2"/>
  <rect fill="#34d399" x="1232" y="56" width="8" height="8" opacity="0.2"/>
  <rect fill="#a78bfa" x="40" y="592" width="8" height="8" opacity="0.4"/>
  <rect fill="#fb923c" x="1232" y="592" width="8" height="8" opacity="0.4"/>
</svg>
